name: Validate Movie Bot

on:
  push:
    branches: ["main", "lavalink-music"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile main.py cloud_backend.py lavalink_manager.py

      - name: Import dependencies
        run: python -c "import aiohttp, discord, wavelink; print(discord.__version__, wavelink.__version__)"
